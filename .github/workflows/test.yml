name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run --json
